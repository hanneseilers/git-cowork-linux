name: Release (Linux)

# Runs when a version tag is pushed (same tags as the macOS release). Builds
# the Linux tarball and .deb for x86_64 and aarch64 and attaches them to the
# GitHub release (created here if the macOS workflow hasn't made it yet).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libsecret-1-dev libcurl4-openssl-dev git python3 ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check tag matches Info.plist
        run: |
          V="$(Scripts/linux/version.sh)"
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match Info.plist version $V"; exit 1; }
      - name: Test
        run: swift test --skip 'KeychainTests|AskpassEndToEnd'
      - name: Build
        run: GIT_COWORK_REPO="$GITHUB_REPOSITORY" make app && make deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: |
            dist/linux/*.tar.gz*
            dist/linux/*.deb*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "git-cowork ${GITHUB_REF_NAME#v}" --notes "Linux: see docs/LINUX.md" --verify-tag
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
