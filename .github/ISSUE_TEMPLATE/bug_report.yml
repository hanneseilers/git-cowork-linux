name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Command log
      description: If a git action failed, paste the relevant lines from the command log (⌘J).
      render: shell
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.1"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: git-cowork version
      description: From git-cowork › About git-cowork, e.g. "0.1.0 (1448777)".
  - type: input
    id: host
    attributes:
      label: Git host
      placeholder: GitHub / GitLab / Gitea / Forgejo / other
